# 공통 원본. 각 기기의 config.toml은 agentctl이 생성한다.
# 모델·추론은 policy/models.toml에서 설치 설정으로 생성한다.
approvals_reviewer = "auto_review"
service_tier = "default"

# 기존 codex.file의 명시적 샌드박스 기본값만 가져온다.
# auto_review는 사용자의 업무 승인/운영 배포 승인을 대신하지 않는다.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
interrupt_message = true
